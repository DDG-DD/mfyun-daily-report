name: 梦想云每日收益推送

on:
  schedule:
    # 每天UTC 2:00 = 北京时间 10:00
    - cron: '0 2 * * *'
  workflow_dispatch:  # 允许手动触发

jobs:
  daily-report:
    runs-on: ubuntu-latest
    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 设置Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: 安装依赖
        run: pip install requests

      - name: 运行推送脚本
        env:
          ACCOUNT1_USERNAME: ${{ secrets.ACCOUNT1_USERNAME }}
          ACCOUNT1_PASSWORD: ${{ secrets.ACCOUNT1_PASSWORD }}
          ACCOUNT2_USERNAME: ${{ secrets.ACCOUNT2_USERNAME }}
          ACCOUNT2_PASSWORD: ${{ secrets.ACCOUNT2_PASSWORD }}
          SERVERCHAN_KEY: ${{ secrets.SERVERCHAN_KEY }}
          USAGE_RATE_THRESHOLD: '75'
        run: python mfyun_daily_report.py
