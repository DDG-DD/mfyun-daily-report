<style>
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;background:#0f0f0f;color:#e0e0e0;min-height:100vh}
.app{max-width:480px;margin:0 auto;padding-bottom:20px}
.navbar{position:sticky;top:0;z-index:100;background:#1a1a1a;border-bottom:1px solid #333;padding:12px 16px;display:flex;justify-content:space-between;align-items:center}

.refresh-btn{background:#2563eb;color:#fff;border:none;padding:6px 14px;border-radius:16px;font-size:13px;cursor:pointer}
.refresh-btn:active{background:#1d4ed8}
.refresh-btn.loading{opacity:.6;pointer-events:none}
.tabs{display:flex;gap:8px;padding:12px 16px}
.tab{flex:1;text-align:center;padding:8px 0;border-radius:20px;background:#2a2a2a;color:#999;font-size:13px;cursor:pointer;transition:all .2s;border:1px solid transparent}
.tab.active{background:#1e3a5f;color:#60a5fa;border-color:#2563eb}
.date-tabs{display:flex;gap:8px;padding:0 16px 12px}
.date-tab{flex:1;text-align:center;padding:6px 0;border-radius:14px;background:#2a2a2a;color:#999;font-size:12px;cursor:pointer;transition:all .2s}
.date-tab.active{background:#374151;color:#fff}
.kpi-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;padding:0 16px 12px}
.kpi-card{background:#1a1a1a;border:1px solid #2a2a2a;border-radius:12px;padding:12px}
.kpi-label{font-size:11px;color:#888;margin-bottom:6px}
.kpi-value{font-size:20px;font-weight:700;color:#fff}
.kpi-sub{font-size:11px;color:#666;margin-top:4px}
.kpi-value.green{color:#22c55e}
.kpi-value.red{color:#ef4444}
.kpi-value.yellow{color:#eab308}
.chart-section{padding:0 16px 12px}
.chart-box{background:#1a1a1a;border:1px solid #2a2a2a;border-radius:12px;padding:12px;position:relative;height:220px}
.chart-title{font-size:12px;color:#888;margin-bottom:8px}
.node-list{padding:0 16px}
.node-item{background:#1a1a1a;border:1px solid #2a2a2a;border-radius:10px;padding:10px 12px;margin-bottom:8px}
.node-item.low-usage{background:#2d1a1a;border-color:#7f1d1d}
.node-header{display:flex;justify-content:space-between;align-items:center;margin-bottom:6px}
.node-name{font-size:13px;font-weight:500;color:#fff;max-width:60%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.node-status{display:flex;align-items:center;gap:5px;font-size:11px;color:#888}
.status-dot{width:8px;height:8px;border-radius:50%}
.status-dot.online{background:#22c55e}
.status-dot.offline{background:#6b7280}
.node-stats{display:flex;justify-content:space-between;font-size:11px;color:#999;margin-bottom:6px}
.node-stats span b{color:#e0e0e0;font-weight:500}
.progress-bar{height:5px;background:#333;border-radius:3px;overflow:hidden}
.progress-fill{height:100%;border-radius:3px;transition:width .3s}
.progress-fill.high{background:#22c55e}
.progress-fill.mid{background:#eab308}
.progress-fill.low{background:#ef4444}
.loading-overlay{position:fixed;top:0;left:0;right:0;bottom:0;background:rgba(0,0,0,.7);display:flex;flex-direction:column;align-items:center;justify-content:center;z-index:1000}
.loading-overlay.hidden{display:none}
.spinner{width:40px;height:40px;border:3px solid #333;border-top-color:#2563eb;border-radius:50%;animation:spin 1s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.loading-text{margin-top:12px;font-size:14px;color:#999}
.error-msg{padding:20px 16px;text-align:center;color:#ef4444;font-size:14px}
.empty-msg{padding:30px 16px;text-align:center;color:#666;font-size:13px}
</style>
</head>

async function login(username,password){var query="mutation login($loginForm:LoginInput!){login(loginInput:$loginForm){access_token refresh_token user_id}}";var resp=await fetch(API_URL,{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({query:query,variables:{loginForm:{username:username,password:password}}})});var data=await resp.json();if(data.errors)throw new Error(data.errors[0].message||"鐧诲綍澶辫触");return data.data.login.access_token}
async function getMachines(token,dateStr){var query="query getMachinePage($page:Int!,$pageSize:Int!,$where:MachineBoolExp,$order_by:[MachineOrderBy!]){result:machines(page:$page,page_size:$pageSize,where:$where,order_by:$order_by){data{host uuid usage_rate online online_desc remark user_bills{profit bill_date total_traffic}}total}}";var resp=await fetch(API_URL,{method:"POST",headers:{"Content-Type":"application/json","Authorization":token},body:JSON.stringify({query:query,variables:{page:1,pageSize:100,where:{user_bills:{bill_date:{_eq:dateStr}}},order_by:[{field:"usage_rate",order:"desc"}]}})});var data=await resp.json();if(data.errors)throw new Error(data.errors[0].message||"鑾峰彇鑺傜偣澶辫触");return data.data.result.data||[]}
function renderKPI(machines,threshold){var total=machines.length;var online=machines.filter(function(m){return m.online===true||m.online===1}).length;var offline=total-online;var tp=0,tt=0,tu=0;machines.forEach(function(m){var b=m.user_bills||[];if(b.length>0){tp+=b[0].profit||0;tt+=b[0].total_traffic||0}tu+=m.usage_rate||0});var avg=total>0?(tu/total*100):0;var pc=tp>0?"green":(tp<0?"red":"");var uc=avg>=threshold?"green":(avg>=50?"yellow":"red");var hc=String.fromCharCode(35);

var html="";cards.forEach(function(c){html+="<div class=\"kpi-card\"><div class=\"kpi-label\">"+c.label+"</div><div class=\"kpi-value "+(c.cls||"")+"\">"+c.value+"</div><div class=\"kpi-sub\">"+c.sub+"</div></div>"});document.getElementById("kpiGrid").innerHTML=html}
function renderChart(machines){var ctx=document.getElementById("mainChart").getContext("2d");if(chartInstance)chartInstance.destroy();var labels=machines.map(function(m,i){return (m.remark||m.host||("鑺傜偣"+(i+1))).slice(0,8)});var profits=machines.map(function(m){var b=m.user_bills||[];return b.length>0?(b[0].profit||0):0});var traffics=machines.map(function(m){var b=m.user_bills||[];return b.length>0?((b[0].total_traffic||0)/1024):0});var threshold=ACCOUNTS[currentAccount].threshold;
var bgColors=machines.map(function(m){return (m.usage_rate*100)<threshold?"rgba(239,68,68,0.7)":"rgba(37,99,235,0.7)"});var c9="#999",c8="#888",c2="#2a2a2a",c6="#60a5fa",c22="#22c55e";
chartInstance=new Chart(ctx,{type:"bar",data:{labels:labels,datasets:[{label:"鏀剁泭楼",data:profits,backgroundColor:bgColors,yAxisID:"y",borderRadius:3},{label:"娴侀噺G",data:traffics,backgroundColor:"rgba(34,197,94,0.5)",yAxisID:"y1",borderRadius:3}]},
options:{responsive:true,maintainAspectRatio:false,plugins:{legend:{labels:{color:c9,font:{size:10}},position:"bottom"}},
scales:{x:{ticks:{color:c8,font:{size:9},maxRotation:45,minRotation:0},grid:{display:false}},
